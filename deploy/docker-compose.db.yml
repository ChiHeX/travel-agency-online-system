services:
  mysql:
    image: mysql:9.7
    container_name: travel-agency-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: travel_agency
      MYSQL_USER: travel
      MYSQL_PASSWORD: travel_password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - travel_agency_mysql_data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  travel_agency_mysql_data:
    name: travel_agency_mysql_data
